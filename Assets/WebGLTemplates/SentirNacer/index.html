<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sentir Nacer · Experiencia inmersiva</title>
    <!--
      Plantilla WebGL "SentirNacer": la experiencia ocupa todo el iframe de la página web
      (web/src/components/ImmersivePlayer.jsx). La selecciona automáticamente
      Tools > Obstetricia > Construir versión Web (WebGL).
    -->
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1a33; font-family: system-ui, sans-serif; }
      #unity-canvas { width: 100%; height: 100%; display: block; outline: none; background: #0b1a33; }
      #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #e6f3ff; gap: 14px; }
      #bar { width: 240px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.15); overflow: hidden; }
      #progress { width: 0%; height: 100%; background: linear-gradient(90deg, #9D508D, #5fd3ff); transition: width 0.2s; }
      #error { display: none; max-width: 420px; text-align: center; color: #ffb4b4; font-size: 14px; padding: 0 16px; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div>Cargando experiencia inmersiva…</div>
      <div id="bar"><div id="progress"></div></div>
      <div id="error"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var progress = document.querySelector("#progress");
      var errorBox = document.querySelector("#error");
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      };

      // El teclado funciona cuando el canvas tiene el foco.
      canvas.addEventListener("pointerdown", function () { canvas.focus(); });
      window.addEventListener("focus", function () { canvas.focus(); });
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, function (p) {
          progress.style.width = Math.round(p * 100) + "%";
        }).then(function () {
          loading.style.display = "none";
          canvas.focus();
        }).catch(function (message) {
          errorBox.style.display = "block";
          errorBox.textContent = "No se pudo cargar la experiencia: " + message;
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
